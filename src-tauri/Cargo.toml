[package]
name = "chojema-office"
version = "0.2.2"
description = "Chojema Office: one place to install, update and open the Chojema Office apps"
authors = ["Chulwoo Park"]
license = "Apache-2.0"
repository = "https://github.com/chojema/chojema-office"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "chojema_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "process", "macros", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
semver = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
